document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

3, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  /* Families */\n  --font-display: 'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;\n  --font-body: 'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;\n\n  /* Slide surface only. Presentations use Arial for deck portability and\n     PowerPoint parity. NEVER use this token in product UI or components. */\n  --font-slide: Arial, Helvetica, 'Liberation Sans', sans-serif;\n\n  /* Weights */\n  --weight-regular: 400;\n  --weight-medium: 500;\n  --weight-semibold: 600;\n  --weight-bold: 700;\n  --weight-extrabold: 800;\n\n  /* Display scale — Figtree. size / line-height / weight */\n  --display-2xl-size: 64px;   --display-2xl-line: 78px;  --display-2xl-weight: 600;  --display-2xl-tracking: -0.028em;\n  --display-xl-size: 52px;    --display-xl-line: 62px;   --display-xl-weight: 600;   --display-xl-tracking: -0.025em;\n  --display-lg-size: 42px;    --display-lg-line: 52px;   --display-lg-weight: 600;   --display-lg-tracking: -0.022em;\n  --display-md-size: 32px;    --display-md-line: 40px;   --display-md-weight: 600;   --display-md-tracking: -0.018em;\n  --display-sm-size: 27px;    --display-sm-line: 35px;   --display-sm-weight: 500;   --display-sm-tracking: -0.014em;\n  --display-xs-size: 22px;    --display-xs-line: 30px;   --display-xs-weight: 500;   --display-xs-tracking: -0.01em;\n\n  /* Text scale — Nunito Sans. size / line-height */\n  --text-xl-size: 20px;   --text-xl-line: 30px;\n  --text-lg-size: 18px;   --text-lg-line: 28px;\n  --text-md-size: 16px;   --text-md-line: 24px;\n  --text-sm-size: 14px;   --text-sm-line: 20px;\n  --text-xs-size: 12px;   --text-xs-line: 18px;\n}\n\n/* Optional ready-made classes consumers can use directly */\n.ds-display-2xl { font-family: var(--font-display); font-weight: var(--display-2xl-weight); font-size: var(--display-2xl-size); line-height: var(--display-2xl-line); letter-spacing: var(--display-2xl-tracking); }\n.ds-display-xl  { font-family: var(--font-display); font-weight: var(--display-xl-weight);  font-size: var(--display-xl-size);  line-height: var(--display-xl-line);  letter-spacing: var(--display-xl-tracking); }\n.ds-display-lg  { font-family: var(--font-display); font-weight: var(--display-lg-weight);  font-size: var(--display-lg-size);  line-height: var(--display-lg-line);  letter-spacing: var(--display-lg-tracking); }\n.ds-display-md  { font-family: var(--font-display); font-weight: var(--display-md-weight);  font-size: var(--display-md-size);  line-height: var(--display-md-line);  letter-spacing: var(--display-md-tracking); }\n.ds-display-sm  { font-family: var(--font-display); font-weight: var(--display-sm-weight);  font-size: var(--display-sm-size);  line-height: var(--display-sm-line); }\n.ds-display-xs  { font-family: var(--font-display); font-weight: var(--display-xs-weight);  font-size: var(--display-xs-size);  line-height: var(--display-xs-line); }\n.ds-text-xl { font-family: var(--font-body); font-size: var(--text-xl-size); line-height: var(--text-xl-line); }\n.ds-text-lg { font-family: var(--font-body); font-size: var(--text-lg-size); line-height: var(--text-lg-line); }\n.ds-text-md { font-family: var(--font-body); font-size: var(--text-md-size); line-height: var(--text-md-line); }\n.ds-text-sm { font-family: var(--font-body); font-size: var(--text-sm-size); line-height: var(--text-sm-line); }\n.ds-text-xs { font-family: var(--font-body); font-size: var(--text-xs-size); line-height: var(--text-xs-line); }\n   /* font families, type scale, fonts (Google Fonts) */\n/* ── Bayone Purpl · Elevation tokens ─────────────────────────────────\n   Six-step shadow scale. Use elevation to communicate hierarchy:\n   XS/SM for resting surfaces, MD/LG for raised cards & popovers,\n   XL/2XL for dialogs and overlays. Shadows are warm-neutral black. */\n\n:root {\n  --shadow-xs:  0 1px 2px rgba(0,0,0,0.06);\n  --shadow-sm:  0  it.', role: 'VP risk operations', company: 'Top-5 US payments network', metric: '68%', metricLabel: 'of fraud cases auto-cleared', photo: 'testimonial-1' },\n  { quote: 'We asked for four data engineers. What arrived was a pod that rewrote how we define a correct number.', role: 'Director of data', company: 'Global commerce marketplace', metric: '9 min', metricLabel: 'data freshness, down from 36h', photo: 'testimonial-2' },\n  { quote: 'The first release cut mean time to recovery by more than half. The second one made it boring, which is better.', role: 'Head of platform', company: 'European retail bank', metric: '−62%', metricLabel: 'mean time to recovery', photo: 'testimonial-3' },\n  { quote: 'Two releases a week, every week, for a year. That cadence is the actual case study.', role: 'VP engineering', company: 'Regional health network', metric: '2/week', metricLabel: 'release cadence, from 2/year', photo: 'testimonial-4' }\n];\n\nconst ARTICLES = [\n  { title: 'LLM triage in front of a fraud desk', desc: 'The model was the easy part. Getting reviewers to trust a pre-written disposition took three rounds of interface work.', tag: 'Applied AI', read: '6 min', name: 'Yogesh Virmani', role: 'Co-founder', photo: 'article-1', avatar: 'lead-1' },\n  { title: 'Hiring for roles that did not exist last year', desc: 'Job titles lag the work by about eighteen months. Here is how we screen for the skill instead of the label.', tag: 'Talent', read: '5 min', name: 'Sonia Seth', role: 'SVP, people engagement', photo: 'article-2', avatar: 'lead-2' },\n  { title: 'The referral economy behind our engagements', desc: 'What a referral-led business forces you to do differently in the first ninety days of every project.', tag: 'Practice', read: '4 min', name: 'Rahul Sharma', role: 'Co-founder', photo: 'article-3', avatar: 'lead-3' },\n  { title: 'Evaluation is the product', desc: 'A scoring harness written before the first prompt is what separates a demo from something legal will sign off.', tag: 'Evaluation', read: '7 min', name: 'BayOne AI practice', role: 'Pleasanton · Bengaluru', photo: 'article-4', avatar: 'lead-4' },\n  { title: 'Nine minutes: a retail platform rebuilt for freshness', desc: 'Latency was never the hard requirement. Agreeing on what a correct number means was.', tag: 'Data', read: '5 min', name: 'BayOne data practice', role: 'Seattle · Chennai', photo: 'article-5', avatar: 'lead-5' },\n  { title: 'Observability that pays for itself', desc: 'Golden-signal dashboards cut a Sev-1 investigation from ninety minutes to twelve.', tag: 'Reliability', read: '6 min', name: 'BayOne SRE practice', role: 'Austin · Toronto', photo: 'article-6', avatar: 'lead-6' }\n];\n\nclass Component extends DCLogic {\n  state = { filter: 'All', item: null, cx: 0, cy: 0, mw: 0, mh: 0, svc: 0, stamp: '', testIdx: 0, articlesView: 'carousel', arc: null };\n\n  componentDidMount() {\n    this.tick();\n    this._clock = setInterval(() => this.tick(), 60000);\n    this._onScroll = () => {\n      if (this._raf) return;\n      this._raf = requestAnimationFrame(() => { this._raf = 0; this.onScroll(); });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    window.addEventListener('resize', this._onScroll, { passive: true });\n    this.onScroll();\n    if (this.mapWrap) {\n      this.mapWrap.addEventListener('case-hover', e => {\n        const d = e.detail;\n        this.setState({ item: d.item, cx: d.x, cy: d.y, mw: d.w, mh: d.h });\n      });\n      this.mapWrap.addEventListener('case-leave', () => this.setState({ item: null }));\n      this.mapWrap.addEventListener('pointerenter', () => this.stopTour());\n      this.mapWrap.addEventListener('pointerleave', () => this.startTour());\n      const globe = this.mapWrap.querySelector('world-map');\n      if (globe) globe.focusK = Number(this.props.globeZoom ?? 1.62);\n      this.startTour();\n    }\n    this.engine = window.StoryArcEngine.create(window.SA_HOME_MODEL);\n    this.engine.apply(null);\n    this._onArc = e => this.setArc(e.detail && e.detail.arc);\n    window.addEventListener('storyarc-apply', this._onArc);\n    let saved = null;\n    try { saved = localStorage.getItem('bayone-story-arc'); } catch (e) {}\n    if (saved) this.setArc(saved);\n    this.sync();\n  }\n\n  componentDidUpdate() { this.sync(); this.applyArc(); }\n\n  // One arc = one recomposition of the whole page: framing slots, section\n  // priority, evidence rank and the collections React renders.\n  setArc(id) {\n    if (!this.engine) return;\n    const plan = this.engine.apply(id);\n    const arc = plan ? plan.arc : null;\n    if (arc !== this.state.arc) this.setState({ arc: arc, testIdx: 0 });\n    try { this.setFilter(this.engine.extra('filter', 'All')); } catch (e) {}\n    setTimeout(() => this.spotlightCase(), 40);\n  }\n\n  applyArc() { if (this.engine) this.engine.paint(); }\n\n  goSvc(i) {\n    if (!this.svcWrap) return;\n    const top = this.svcWrap.getBoundingClientRect().top + window.scrollY + i * window.innerHeight + 6;\n    window.scrollTo({ top: top, behavior: 'smooth' });\n  }\n\n  componentWillUnmount() {\n    clearInterval(this._clock); this.stopTour();\n    window.removeEventListener('scroll', this._onScroll);\n    window.removeEventListener('resize', this._onScroll);\n    window.removeEventListener('storyarc-apply', this._onArc);\n  }\n\n  tick() {\n    const d = new Date();\n    this.setState({\n      stamp: d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' · ' +\n             d.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' })\n    });\n  }\n\n  // Emphasis without removal: open the arc's most relevant case first, with\n  // every marker still on the map.\n  spotlightCase() {\n    const id = this.engine ? this.engine.extra('spotlight', null) : null;\n    const map = this.mapWrap && this.mapWrap.querySelector('world-map');\n    if (!id || !map) return;\n    const gs = Array.prototype.slice.call(map.querySelectorAll('.wm-marker'));\n    // markers are built after the atlas fetch — wait for them, then spotlight\n    if (!gs.length) {\n      map.addEventListener('markers-ready', () => this.spotlightCase(), { once: true });\n      return;\n    }\n    const i = gs.map(g => g.getAttribute('data-id')).indexOf(id);\n    if (i > -1) {\n      this._ti = i;\n      gs[i].dispatchEvent(new PointerEvent('pointerenter', { bubbles: false }));\n      this.stopTour();\n      this.startTour();\n    }\n  }\n\n  startTour() {\n    if (!(this.props.caseAutoTour ?? true) || this._tour) return;\n    const map = this.mapWrap && this.mapWrap.querySelector('world-map');\n    if (map && !map.querySelectorAll('.wm-marker').length) {\n      map.addEventListener('markers-ready', () => this.startTour(), { once: true });\n      return;\n    }\n    this._tour = setInterval(() => {\n      const map = this.mapWrap && this.mapWrap.querySelector('world-map');\n      if (!map) return;\n      const gs = map.querySelectorAll('.wm-marker:not(.wm-dim)');\n      if (!gs.length) return;\n      this._ti = ((this._ti == null ? -1 : this._ti) + 1) % gs.length;\n      gs[this._ti].dispatchEvent(new PointerEvent('pointerenter', { bubbles: false }));\n    }, 4600);\n  }\n\n  stopTour() { clearInterval(this._tour); this._tour = null; }\n\n  setFilter(name) {\n    this.setState({ filter: name, item: null });\n    const map = this.mapWrap && this.mapWrap.querySelector('world-map');\n    if (map && map.setFilter) map.setFilter(name);\n    this._ti = null;\n  }\n\n  setTest(i) { this.setState({ testIdx: (i + TESTIMONIALS.length) % TESTIMONIALS.length }); }\n\n  scrollArticles(dir) {\n    if (!this.articlesTrack) return;\n    const card = this.articlesTrack.querySelector('a');\n    const w = card ? card.getBoundingClientRect().width + 20 : 380;\n    this.articlesTrack.scrollBy({ left: dir * w, behavior: 'smooth' });\n  }\n\n  sync() {\n    const f = this.state.filter;\n    document.querySelectorAll('[data-f]').forEach(b => {\n      const on = b.dataset.f === f;\n      b.style.background = on ? 'rgb(204,41,122)' : 'transparent';\n      b.style.color = on ? '#fff' : 'rgba(23,23,23,.6)';\n      b.style.boxShadow = on ? 'inset 0 0 0 1px rgb(204,41,122)' : 'inset 0 0 0 1px rgba(23,23,23,.16)';\n    });\n    if (this.rail) {\n      this.rail.querySelectorAll('[data-dot]').forEach((d, i) => {\n        const on = i === this.state.svc;\n        d.style.background = on ? 'rgb(204,41,122)' : 'rgba(23,23,23,.22)';\n        d.style.transform = on ? 'scale(1.6)' : 'scale(1)';\n      });\n      const vis = this.svcWrap ? this.svcWrap.getBoundingClientRect() : null;\n      this.rail.style.opacity = vis && vis.top < window.innerHeight * 0.5 && vis.bottom > window.innerHeight * 0.5 ? '1' : '0';\n      this.rail.style.transition = 'opacity .25s ease';\n    }\n  }\n\n  onScroll() {\n    if (this.nav) {\n      const s = window.scrollY > 40;\n      this.nav.style.background = s ? 'rgba(255,255,255,.92)' : 'rgba(255,255,255,.6)';\n    }\n    if (this.svcWrap) {\n      const cards = this._cards || (this._cards = Array.from(this.svcWrap.querySelectorAll('[data-svc]')));\n      const vh = window.innerHeight;\n      let active = 0;\n      cards.forEach((c, i) => {\n        const inner = c.firstElementChild;\n        const next = cards[i + 1];\n        let p = 0;\n        if (next) {\n          const t = next.getBoundingClientRect().top;\n          p = Math.min(1, Math.max(0, 1 - t / vh));\n        }\n        if (inner) {\n          inner.style.transform = 'scale(' + (1 - p * 0.08).toFixed(3) + ') translateY(' + (-p * 36).toFixed(1) + 'px)';\n          inner.style.opacity = (1 - p * 0.9).toFixed(3);\n        }\n        if (c.getBoundingClientRect().top <= 2) active = i;\n      });\n      if (active !== this.state.svc) this.setState({ svc: active });\n      else this.sync();\n    }\n  }\n\n  renderVals() {\n    const s = this.state;\n    const item = s.item || this._last;\n    if (s.item) this._last = s.item;\n    const on = !!s.item;\n    const W = 320;\n    const left = Math.min(Math.max(s.cx + 22, 12), Math.max(12, s.mw - W - 12));\n    const top = Math.min(Math.max(s.cy - 60, 12), Math.max(12, s.mh - 300));\n\n    const tSrc = this.engine ? this.engine.collection('testimonials', TESTIMONIALS) : TESTIMONIALS;\n    const aSrc = this.engine ? this.engine.collection('articles', ARTICLES) : ARTICLES;\n\n    const testimonials = tSrc.map((t, i) => {\n      const activeSlide = i === (s.testIdx % tSrc.length);\n      return Object.assign({}, t, {\n        slideStyle: {\n          position: i === 0 ? 'relative' : 'absolute', top: 0, left: 0, right: 0,\n          display: 'flex', flexWrap: 'wrap', minHeight: 'clamp(340px,40vw,440px)',\n          opacity: activeSlide ? 1 : 0, pointerEvents: activeSlide ? 'auto' : 'none',\n          transition: 'opacity .5s ease', zIndex: activeSlide ? 2 : 1\n        },\n        onDot: () => this.setTest(i),\n        dotStyle: {\n          width: activeSlide ? '20px' : '7px', height: '7px', borderRadius: '9999px', border: 0, padding: 0,\n          cursor: 'pointer', background: activeSlide ? 'rgb(204,41,122)' : 'rgba(23,23,23,.2)',\n          transition: 'all .2s ease'\n        }\n      });\n    });\n\n    const vals = {\n      scanOn: this.props.scanlines ?? true,\n      stamp: s.stamp,\n      navRef: el => { this.nav = el; },\n      railRef: el => { this.rail = el; },\n      svcRef: el => { this.svcWrap = el; this._cards = null; },\n      mapRef: el => { this.mapWrap = el; },\n      onFilterAll: () => this.setFilter('All'),\n      onFilterAI: () => this.setFilter('Artificial Intelligence'),\n      onFilterData: () => this.setFilter('Data Engineering'),\n      onFilterApp: () => this.setFilter('Application Modernization'),\n      onFilterSre: () => this.setFilter('Site Reliability Engineering'),\n      onFilterXd: () => this.setFilter('Experience Design'),\n      onFilterTalent: () => this.setFilter('Talent Solutions'),\n      caseIndustry: item ?
